# Instalação local sem serviços contratados. O acesso fica restrito a este computador.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: product
      FREE_ONLY: "true"
      API_HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data/product
      DATABASE_URL: ""
      APP_PUBLIC_URL: http://localhost:3001
      ALLOW_REMOTE_SETUP: "true"
      COOKIE_SECURE: "false"
    volumes:
      - productdata:/app/data/product
    restart: unless-stopped
volumes:
  productdata:
